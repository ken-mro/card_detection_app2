<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Playing Card Detection PWA - Detect playing cards using your camera">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Card Detect">

    <title>Card Detection</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">

    <!-- ONNX Runtime Web for local model inference -->
    <script src="https://unpkg.com/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>Card Detection</h1>
            <span class="status-badge" id="statusBadge">Ready</span>
        </header>

        <!-- Camera View -->
        <main class="main-content">
            <div class="camera-container" id="cameraContainer">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay" class="overlay-canvas"></canvas>
                <button class="camera-switch-btn" id="cameraSwitchBtn" title="Switch Camera">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 3h5v5M8 21H3v-5"/>
                        <path d="M21 3L14 10M3 21l7-7"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
                <div class="detection-indicator" id="detectionIndicator">
                    <span class="indicator-text">Detecting...</span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill"></div>
                    </div>
                </div>
            </div>

            <!-- Result View -->
            <div class="result-container hidden" id="resultContainer">
                <div class="result-card">
                    <div class="card-display" id="cardDisplay">
                        <div class="detected-card" id="detectedCard"></div>
                    </div>
                    <div class="result-info">
                        <h2 class="card-name" id="cardName">--</h2>
                        <div class="confidence-display">
                            <span class="confidence-label">Confidence:</span>
                            <span class="confidence-value" id="confidenceValue">--%</span>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="scanAgainBtn">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6"/>
                            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                        </svg>
                        Scan Another Card
                    </button>
                </div>
            </div>

            <!-- Error View -->
            <div class="error-container hidden" id="errorContainer">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <h2 class="error-title" id="errorTitle">Camera Access Required</h2>
                <p class="error-message" id="errorMessage">Please allow camera access to detect playing cards.</p>
                <button class="btn btn-primary" id="retryBtn">Try Again</button>
            </div>
        </main>

        <!-- Settings Panel -->
        <div class="settings-panel hidden" id="settingsPanel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="confidenceThreshold">Detection Threshold</label>
                    <div class="setting-control">
                        <input type="range" id="confidenceThreshold" min="50" max="95" value="75">
                        <span id="thresholdValue">75%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="vibrationToggle">Vibration Feedback</label>
                    <div class="setting-control">
                        <label class="switch">
                            <input type="checkbox" id="vibrationToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="setting-item" id="vibrationDurationItem">
                    <label for="vibrationDuration">Vibration Duration</label>
                    <div class="setting-control">
                        <input type="range" id="vibrationDuration" min="100" max="3000" step="100" value="200">
                        <span id="vibrationDurationValue">0.2s</span>
                    </div>
                </div>
                <button class="btn btn-secondary" id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>

        <!-- Footer Controls -->
        <footer class="footer">
            <button class="footer-btn" id="settingsBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>
                Settings
            </button>
        </footer>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p id="loadingText">Loading model...</p>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
